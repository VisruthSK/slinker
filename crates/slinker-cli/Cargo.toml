[package]
name = "slinker-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Link R package dependencies into a generated source package"

[[bin]]
name = "slinker"
path = "src/main.rs"

[dependencies]
slinker-core.workspace = true
slinker-r-worker.workspace = true
anstream.workspace = true
clap.workspace = true
dunce.workspace = true
serde_json.workspace = true
which.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[test]]
name = "schedule_determinism"
harness = false

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "cache"
harness = false

[features]
profile = ["slinker-core/profile"]

[lints]
workspace = true
