[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
slinker-core = { path = "crates/slinker-core" }
slinker-r-worker = { path = "crates/slinker-r-worker" }

sha2 = "0.11"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
dunce = "1.0"
tempfile = "3.23"
thiserror = "2.0"
rayon = "1.12"
r-description-parser = "0.4.0"
r-metadata = "0.4.0"
regex = "1.13.1"
which = "8.0.6"
anstream = "1.0.0"
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "color", "error-context", "suggestions"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Keep slinker's direct Air crates on the exact parser revision used by the
# pinned Ark/Oak revision. Do not reintroduce an independent Air tag/version.
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "d2659d5b158374bf486b594625ca50abbd0ac879" }
air_r_syntax = { git = "https://github.com/posit-dev/air", rev = "d2659d5b158374bf486b594625ca50abbd0ac879" }
biome_rowan = { git = "https://github.com/lionel-/biome", rev = "a1296ea6ba363d8b8d8f02181b2a4ce9315c5ef9" }

# Oak semantic analysis only. Do not pull Ark runtime/LSP/Jupyter crates.
oak_semantic = { git = "https://github.com/posit-dev/ark", rev = "37fe33a19c4fc678da32c5c23111306b52019f4a" }
harp = { git = "https://github.com/posit-dev/ark", rev = "37fe33a19c4fc678da32c5c23111306b52019f4a" }
libr = { git = "https://github.com/posit-dev/ark", rev = "37fe33a19c4fc678da32c5c23111306b52019f4a" }

[workspace.lints.clippy]
assigning_clones = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
used_underscore_binding = "warn"
