[package]
name = "slinker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Target-specific linker for installed R package images"
license = "BSD-3-Clause"
publish = false

[[bin]]
name = "slinker"
path = "src/main.rs"
required-features = ["air"]

[features]
default = ["air"]
air = [
    "dep:air_r_parser",
    "dep:air_r_syntax",
    "dep:oak_semantic",
    "dep:rayon",
]

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.12", optional = true }

# Keep slinker's direct Air crates on the exact parser revision used by the
# pinned Ark/Oak revision. Do not reintroduce an independent Air tag/version.
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "d2659d5b158374bf486b594625ca50abbd0ac879", optional = true }
air_r_syntax = { git = "https://github.com/posit-dev/air", rev = "d2659d5b158374bf486b594625ca50abbd0ac879", optional = true }

# Oak semantic analysis only. Do not pull Ark runtime/LSP/Jupyter crates.
oak_semantic = { git = "https://github.com/posit-dev/ark", rev = "37fe33a19c4fc678da32c5c23111306b52019f4a", optional = true }

# DESCRIPTION parsing and semantic R package metadata.
r-description-parser = "0.2.0"
r-metadata = "0.2.0"
